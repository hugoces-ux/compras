<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lista de Compras do Mes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --green:#2E5A34; --green-deep:#1E3D21; --green-soft:#E4EEDE; --green-light:#D9E8D4;
    --bg:#ECEFE6; --card:#FFFFFF; --surface-2:#FAFBF7;
    --text:#1C2A1A; --muted:#6B7566; --accent:#C77D33; --accent-soft:#F6ECDD;
    --border:#E1E5DC; --line:rgba(28,42,26,0.09);
    --red:#A23B44; --berry:#A23B44; --leaf:#4C8A52; --blue:#3E6B8A;
    --sh-sm:0 1px 2px rgba(28,42,26,.06);
    --sh:0 10px 26px -14px rgba(28,42,26,.24), 0 2px 6px -3px rgba(28,42,26,.10);
    --sh-lg:0 18px 40px -16px rgba(28,42,26,.32), 0 5px 12px -5px rgba(28,42,26,.14);
    --r-sm:9px; --r:13px; --r-lg:18px;
    --ui:'Inter',-apple-system,"Segoe UI",Arial,sans-serif;
    --display:'Fraunces','Iowan Old Style',Georgia,serif;
    --ease:cubic-bezier(.4,0,.2,1);
  }
  *{box-sizing:border-box;}
  body{
    font-family: var(--ui);
    background:var(--bg); color:var(--text); margin:0; padding:0 0 120px 0;
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  }
  header{
    background:var(--green); color:#fff; padding:20px 24px 0;
    position:sticky; top:0; z-index:5;
  }
  header h1{margin:0 0 4px; font-size:1.3rem;}
  header p{margin:0; font-size:0.85rem; opacity:0.85;}
  .titulo-mes{
    margin-top:10px; display:flex; gap:8px; align-items:center; flex-wrap:wrap;
  }
  .titulo-mes input{
    font-size:0.9rem; padding:6px 10px; border-radius:6px; border:none;
    background:rgba(255,255,255,0.15); color:#fff;
  }
  .titulo-mes input::placeholder{color:rgba(255,255,255,0.7);}

  /* ---- abas ---- */
  .abas{display:flex; gap:4px; margin-top:14px;}
  .aba{
    background:transparent; border:none; color:rgba(255,255,255,0.7);
    padding:10px 16px; font-size:0.9rem; font-family:inherit; cursor:pointer;
    border-bottom:3px solid transparent; border-radius:6px 6px 0 0;
  }
  .aba:hover{color:#fff; background:rgba(255,255,255,0.08);}
  .aba.ativa{color:#fff; border-bottom-color:var(--accent); font-weight:600;}

  .toolbar{
    display:flex; gap:10px; padding:14px 24px; background:#fff; border-bottom:1px solid var(--border);
    position:sticky; top:130px; z-index:4; flex-wrap:wrap; align-items:center;
  }
  .toolbar input[type=text]{
    flex:1; min-width:160px; padding:8px 12px; border:1px solid var(--border); border-radius:8px; font-size:0.9rem;
  }
  .btn{
    border:1px solid var(--border); background:#fff; color:var(--text); padding:8px 14px;
    border-radius:8px; font-size:0.85rem; cursor:pointer; white-space:nowrap; font-family:inherit;
  }
  .btn:hover{background:var(--green-light);}
  .btn:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
  .btn.primary{background:var(--green); color:#fff; border-color:var(--green);}
  .btn.primary:hover{background:#25401f;}
  .btn.accent{background:var(--accent); color:#fff; border-color:var(--accent);}
  .btn.accent:hover{background:#b06a24;}
  .btn.danger{color:var(--red); border-color:#e8cfd0;}
  .btn.danger:hover{background:#fbeff0;}
  main{padding:10px 24px;}
  .categoria{
    background:var(--card); border:1px solid var(--border); border-radius:10px;
    margin:14px 0; overflow:hidden;
  }
  .cat-header{
    display:flex; justify-content:space-between; align-items:center;
    padding:12px 16px; background:var(--green-light); cursor:pointer; user-select:none;
  }
  .cat-header .cat-title{font-weight:600; color:var(--green); font-size:0.95rem;}
  .cat-header .cat-meta{font-size:0.78rem; color:var(--muted);}
  .cat-toggle-all{font-size:0.75rem; color:var(--green); text-decoration:underline; cursor:pointer; margin-left:10px;}
  .cat-body{padding:4px 8px;}
  .item-row{
    display:flex; align-items:center; gap:10px; padding:9px 8px; border-bottom:1px solid #F0F1EC; font-size:0.88rem;
  }
  .item-row:last-child{border-bottom:none;}
  .item-row input[type=checkbox]{width:18px; height:18px; accent-color:var(--green); cursor:pointer; flex-shrink:0;}
  .item-desc{flex:1; min-width:0;}
  .item-desc .padrao{display:block; font-size:0.72rem; color:var(--muted);}
  .tag-barato{
    display:inline-block; margin-top:4px; font-size:0.7rem; font-weight:600;
    background:#EAF3EA; color:#2f5233; border:1px solid #cfe3cf;
    border-radius:20px; padding:1px 9px; line-height:1.5;
  }
  .qtd-box{display:flex; align-items:center; gap:4px; flex-shrink:0;}
  .qtd-box button{
    width:24px; height:24px; border:1px solid var(--border); background:#fff; border-radius:5px; cursor:pointer; font-size:0.9rem; line-height:1;
  }
  .qtd-box input{width:42px; text-align:center; border:1px solid var(--border); border-radius:5px; padding:3px; font-size:0.85rem;}
  .un-label{font-size:0.72rem; color:var(--muted); width:24px;}
  .preco-label{font-size:0.78rem; color:var(--muted); width:66px; text-align:right; flex-shrink:0;}
  .remover-item{font-size:0.72rem; color:var(--red); cursor:pointer; text-decoration:underline; flex-shrink:0;}
  .hidden{display:none !important;}
  .novo-item-card .cat-header{cursor:default; background:#EFE7DA;}
  .novo-item-form{
    padding:14px 16px; display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end;
  }
  .campo{display:flex; flex-direction:column; gap:4px; font-size:0.75rem; color:var(--muted);}
  .campo input, .campo select{
    padding:7px 9px; border:1px solid var(--border); border-radius:7px; font-size:0.88rem; font-family:inherit;
  }
  .campo.produto{flex:2; min-width:200px;}
  .campo.qtd{width:70px;}
  .campo.un{width:70px;}
  .campo.preco{width:100px;}
  .campo.cat{min-width:160px;}
  footer{
    position:fixed; bottom:0; left:0; right:0; background:#fff; border-top:1px solid var(--border);
    padding:12px 24px; display:flex; justify-content:space-between; align-items:center; gap:16px; flex-wrap:wrap;
    box-shadow:0 -4px 14px rgba(0,0,0,0.06); z-index:6;
  }
  .resumo{font-size:0.88rem;}
  .resumo b{color:var(--green); font-size:1.05rem;}
  .footer-actions{display:flex; gap:8px; flex-wrap:wrap;}

  /* ---- painel ---- */
  .kpis{display:grid; grid-template-columns:repeat(auto-fit, minmax(160px,1fr)); gap:12px; margin:14px 0;}
  .kpi{
    background:var(--card); border:1px solid var(--border); border-radius:10px; padding:14px 16px;
  }
  .kpi .rotulo{font-size:0.72rem; color:var(--muted); text-transform:uppercase; letter-spacing:0.04em;}
  .kpi .valor{font-size:1.45rem; font-weight:600; color:var(--green); margin-top:6px; line-height:1.15;}
  .kpi .nota{font-size:0.74rem; color:var(--muted); margin-top:4px;}
  .kpi .nota.sobe{color:var(--red);}
  .kpi .nota.desce{color:#3f7a4a;}

  .painel{
    background:var(--card); border:1px solid var(--border); border-radius:10px;
    margin:14px 0; padding:16px;
  }
  .painel h2{
    margin:0 0 4px; font-size:0.95rem; color:var(--green);
  }
  .painel .sub{margin:0 0 14px; font-size:0.78rem; color:var(--muted);}

  .barra-linha{margin-bottom:10px;}
  .barra-topo{display:flex; justify-content:space-between; align-items:baseline; gap:10px; font-size:0.82rem; margin-bottom:4px;}
  .barra-topo .nome{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .barra-topo .val{color:var(--muted); font-size:0.78rem; white-space:nowrap; flex-shrink:0;}
  .barra-trilho{background:#F0F1EC; border-radius:4px; height:9px; overflow:hidden;}
  .barra-preenche{height:100%; border-radius:4px;}

  .legenda{display:flex; flex-wrap:wrap; gap:10px 16px; margin-top:12px; font-size:0.75rem; color:var(--muted);}
  .legenda span{display:flex; align-items:center; gap:5px;}
  .legenda i{width:10px; height:10px; border-radius:2px; display:inline-block;}

  .vazio{
    text-align:center; padding:28px 16px; color:var(--muted); font-size:0.85rem; line-height:1.6;
  }
  .vazio b{display:block; color:var(--text); font-size:0.9rem; margin-bottom:6px;}

  table.hist{width:100%; border-collapse:collapse; font-size:0.84rem;}
  table.hist th{
    text-align:left; font-size:0.72rem; text-transform:uppercase; letter-spacing:0.04em;
    color:var(--muted); font-weight:600; padding:8px 6px; border-bottom:1px solid var(--border);
  }
  table.hist td{padding:9px 6px; border-bottom:1px solid #F0F1EC;}
  table.hist td.num{text-align:right; white-space:nowrap;}
  table.hist tr:last-child td{border-bottom:none;}
  .dif-sobe{color:var(--red);}
  .dif-desce{color:#3f7a4a;}

  /* preco editavel na lista */
  .preco-box{display:flex; align-items:center; gap:3px; flex-shrink:0;}
  .preco-box .cifra{font-size:0.72rem; color:var(--muted);}
  .preco-box input{
    width:66px; text-align:right; border:1px solid var(--border); border-radius:5px;
    padding:3px 5px; font-size:0.8rem; font-family:inherit; color:var(--text);
  }

  /* comparativo de mercados */
  .podio{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin-bottom:14px;}
  .podio-card{border:1px solid var(--border); border-radius:10px; padding:12px 14px; position:relative;}
  .podio-card.melhor{border-color:#3f7a4a; background:#F1F7F1;}
  .podio-card.pior{border-color:#e8cfd0; background:#FBF3F3;}
  .podio-card .tag{font-size:0.68rem; text-transform:uppercase; letter-spacing:0.05em; font-weight:600;}
  .podio-card.melhor .tag{color:#3f7a4a;}
  .podio-card.pior .tag{color:var(--red);}
  .podio-card .nome{font-size:0.95rem; font-weight:600; margin:4px 0 2px; color:var(--text);}
  .podio-card .val{font-size:1.25rem; font-weight:600; color:var(--green);}
  .podio-card .sub{font-size:0.72rem; color:var(--muted); margin-top:2px;}

  table.comparativo{width:100%; border-collapse:collapse; font-size:0.82rem;}
  table.comparativo th{
    text-align:right; font-size:0.72rem; color:var(--muted); font-weight:600;
    padding:8px 8px; border-bottom:2px solid var(--border); white-space:nowrap;
  }
  table.comparativo th:first-child{text-align:left;}
  table.comparativo td{padding:8px 8px; border-bottom:1px solid #F0F1EC; text-align:right; white-space:nowrap;}
  table.comparativo td:first-child{text-align:left; color:var(--text);}
  table.comparativo td.barato{background:#EAF3EA; color:#2f5233; font-weight:600; border-radius:4px;}
  table.comparativo tr.total-row td{border-top:2px solid var(--border); border-bottom:none; font-weight:600; padding-top:10px;}
  table.comparativo tr.total-row td:first-child{color:var(--green);}
  .tabela-rolagem{overflow-x:auto; -webkit-overflow-scrolling:touch;}

  /* comparacao justa */
  .justa-card{border:1px solid var(--border); border-radius:10px; padding:14px 16px; margin-bottom:10px; border-left-width:4px;}
  .justa-card.melhor{border-left-color:#3f7a4a; background:#F4F9F4;}
  .justa-card.pior{border-left-color:var(--red); background:#FDF6F6;}
  .justa-topo{display:flex; justify-content:space-between; align-items:baseline; gap:10px; flex-wrap:wrap;}
  .justa-topo b{font-size:1rem; color:var(--text);}
  .justa-topo .comum{font-size:0.75rem; color:var(--muted);}
  .justa-linha{font-size:0.88rem; color:var(--text); margin:8px 0 6px; line-height:1.5;}
  .justa-veredito{font-size:0.9rem; font-weight:600;}
  .justa-veredito.bom{color:#3f7a4a;}
  .justa-veredito.ruim{color:var(--red);}
  .justa-nota{font-size:0.74rem; color:var(--muted); margin-top:6px;}

  /* comparador */
  .comp-lista{display:flex; flex-direction:column; gap:10px; margin-top:14px;}
  .comp-item{background:var(--card); border:1px solid var(--border); border-radius:10px; padding:12px 14px;}
  .comp-topo{display:flex; justify-content:space-between; align-items:baseline; gap:10px;}
  .comp-nome{font-weight:600; font-size:0.92rem; color:var(--text);}
  .comp-cat{display:inline-block; font-size:0.68rem; color:var(--muted); font-weight:500; background:var(--bg); border:1px solid var(--border); border-radius:20px; padding:1px 8px; margin-left:8px; vertical-align:middle;}
  .merc-chips{display:flex; flex-wrap:wrap; gap:6px; margin:9px 0 8px;}
  .merc-chip{font-size:0.78rem; color:var(--muted); background:var(--bg); border:1px solid var(--border); border-radius:8px; padding:3px 9px;}
  .merc-chip b{color:var(--text); font-weight:600;}
  .merc-chip.melhor{background:#EAF3EA; border-color:#cfe3cf; color:#2f5233;}
  .merc-chip.melhor b{color:#2f5233;}
  .merc-chip.pior{background:#FBF3F3; border-color:#e8cfd0; color:#8a3b3d;}
  .comp-rodape{font-size:0.8rem;}
  .comp-econ{color:#3f7a4a;}
  .comp-uni{color:var(--muted);}

  /* variacao */
  .var-lista{display:flex; flex-direction:column; gap:10px; margin-top:14px;}
  .var-item{background:var(--card); border:1px solid var(--border); border-radius:10px; padding:12px 14px;}
  .var-topo{display:flex; justify-content:space-between; align-items:baseline; gap:10px; flex-wrap:wrap; margin-bottom:10px;}
  .var-nome{font-weight:600; font-size:0.92rem; color:var(--text);}
  .var-tag{font-size:0.8rem; font-weight:600; white-space:nowrap;}
  .var-tag.sobe{color:var(--red);}
  .var-tag.desce{color:#3f7a4a;}
  .var-tag.igual{color:var(--muted);}
  .var-linha{display:flex; align-items:stretch; gap:6px; flex-wrap:wrap;}
  .var-ponto{border:1px solid var(--border); border-radius:8px; padding:6px 10px; background:var(--bg); min-width:96px;}
  .var-ponto.min{background:#EAF3EA; border-color:#cfe3cf;}
  .var-ponto.max{background:#FBF3F3; border-color:#e8cfd0;}
  .vp-merc{font-size:0.76rem; color:var(--text); display:flex; align-items:center;}
  .vp-data{font-size:0.68rem; color:var(--muted); margin:1px 0 2px;}
  .vp-preco{font-size:0.95rem; font-weight:700; color:var(--text);}
  .var-ponto.min .vp-preco{color:#2f5233;}
  .var-ponto.max .vp-preco{color:var(--red);}
  .var-seta{display:flex; align-items:center; color:var(--muted); font-size:1.1rem;}
  .var-rodape{font-size:0.76rem; color:var(--muted); margin-top:9px;}

  /* cesta otimizada */
  .otim-destaque{font-size:0.9rem; line-height:1.55; color:var(--text); background:var(--bg); border:1px solid var(--border); border-radius:9px; padding:12px 14px; margin-bottom:14px;}
  .otim-destaque.ganho{background:#F1F7F1; border-color:#cfe3cf;}
  .otim-nota{font-size:0.75rem; color:var(--muted); margin-top:6px;}
  .plano-titulo{font-size:0.82rem; font-weight:600; color:var(--green); margin:14px 0 8px;}
  .plano-merc{border:1px solid var(--border); border-radius:9px; padding:10px 12px; margin-bottom:8px;}
  .plano-merc-cab{font-weight:600; font-size:0.86rem; color:var(--text); margin-bottom:6px; display:flex; justify-content:space-between; gap:10px;}
  .plano-merc-cab span{color:var(--muted); font-weight:500; font-size:0.76rem;}
  .plano-itens{display:flex; flex-wrap:wrap; gap:5px;}
  .plano-item{font-size:0.76rem; background:var(--bg); border:1px solid var(--border); border-radius:7px; padding:2px 8px; color:var(--text);}
  .plano-item i{color:var(--muted); font-style:normal; font-size:0.72rem;}

  /* selos de mercado */
  .mseloi{display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:5px; vertical-align:baseline;}
  .merc-chip .mseloi{margin-right:4px;}

  /* detalhe por compra */
  .compra-card{border:1px solid var(--border); border-radius:10px; padding:14px 16px; margin-bottom:12px; background:var(--card);}
  .compra-head{display:flex; justify-content:space-between; align-items:flex-start; gap:12px; margin-bottom:14px; flex-wrap:wrap;}
  .compra-merc{font-size:1.02rem; font-weight:600; color:var(--text);}
  .compra-data{font-size:0.75rem; color:var(--muted); margin-top:2px;}
  .compra-total{text-align:right;}
  .ct-val{font-size:1.3rem; font-weight:700; color:var(--green); line-height:1.1;}
  .ct-sub{font-size:0.74rem; color:var(--muted); margin-top:2px;}
  .compra-corpo{display:grid; grid-template-columns:1fr 1fr; gap:20px;}
  .col-tit{font-size:0.72rem; text-transform:uppercase; letter-spacing:0.04em; color:var(--muted); font-weight:600; margin-bottom:9px;}
  .top-lista{display:flex; flex-direction:column; gap:4px;}
  .top-item{display:flex; justify-content:space-between; gap:8px; font-size:0.83rem; padding:4px 0; border-bottom:1px solid #F0F1EC;}
  .top-item:last-child{border-bottom:none;}
  .ti-nome i{color:var(--muted); font-style:normal; font-size:0.72rem;}
  .ti-val{font-weight:600; white-space:nowrap;}
  .compra-nota{font-size:0.76rem; color:var(--muted); margin-top:10px;}
  .compra-nota b{color:var(--text);}

  /* composicao empilhada */
  .stk-row{display:flex; align-items:center; gap:10px; margin-bottom:10px;}
  .stk-lab{width:130px; font-size:0.83rem; flex-shrink:0;}
  .stk-bar{flex:1; height:22px; border-radius:6px; overflow:hidden; display:flex; background:#F0F1EC;}
  .stk-seg{height:100%;}
  @media (max-width:640px){ .compra-corpo{grid-template-columns:1fr; gap:14px;} .stk-lab{width:96px;} }

  svg.grafico{width:100%; height:auto; display:block;}
  svg.grafico text{font-family:inherit;}

  /* ---- modal ---- */
  .modal-bg{
    position:fixed; inset:0; background:rgba(34,48,30,0.45); z-index:10;
    display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .modal{
    background:#fff; border-radius:12px; padding:22px; width:100%; max-width:420px;
    box-shadow:0 12px 40px rgba(0,0,0,0.2);
  }
  .modal h3{margin:0 0 6px; font-size:1.05rem; color:var(--green);}
  .modal p.ajuda{margin:0 0 16px; font-size:0.82rem; color:var(--muted); line-height:1.5;}
  .modal label{display:block; font-size:0.75rem; color:var(--muted); margin-bottom:4px;}
  .modal input{
    width:100%; padding:9px 11px; border:1px solid var(--border); border-radius:8px;
    font-size:0.95rem; font-family:inherit; margin-bottom:14px;
  }
  .modal-actions{display:flex; gap:8px; justify-content:flex-end;}

  .aviso{
    background:#FBF3E7; border:1px solid #EBD9BE; color:#7a5a2a;
    border-radius:8px; padding:10px 12px; font-size:0.78rem; line-height:1.5; margin:14px 0;
  }

  @media (max-width:640px){
    header, .toolbar, main, footer{padding-left:14px; padding-right:14px;}
    .toolbar{top:150px;}
    .preco-label{display:none;}
    .item-desc{font-size:0.85rem;}
    footer{flex-direction:column; align-items:stretch; gap:10px;}
    .footer-actions{justify-content:stretch;}
    .footer-actions .btn{flex:1;}
  }
  @media (prefers-reduced-motion:reduce){
    *{transition:none !important; animation:none !important;}
  }
  @media print{
    header, .toolbar, footer, .cat-header .cat-toggle-all, .novo-item-card, .abas{display:none !important;}
    body{padding:0;}
    .categoria{border:none; margin:0;}
  }
  /* ============================================================
     CAMADA DE DESIGN — profundidade, tipografia, hover, entrada
     ============================================================ */
  body{ background:
      radial-gradient(1200px 500px at 100% -10%, #E7ECDF 0%, transparent 60%),
      var(--bg); }
  ::selection{ background:var(--green-soft); }

  /* numeros tabulares onde ha dinheiro */
  .ct-val,.ci-val,.kpi .valor,.vp-preco,.merc-chip b,.ti-val,.barra-topo .val,
  table.hist td.num,table.comparativo td,.resumo b,.podio-card .val,.stk-lab,

  /* ---------- header ---------- */
  header{
    background:linear-gradient(160deg,#356139 0%, var(--green) 55%, var(--green-deep) 100%);
    box-shadow:0 10px 30px -18px rgba(28,42,26,.55);
    border-bottom:1px solid rgba(0,0,0,.08);
  }
  header h1{
    font-family:var(--display); font-weight:600; font-size:1.5rem; letter-spacing:-0.01em;
    font-optical-sizing:auto; display:flex; align-items:center; gap:9px;
  }
  header h1::before{
    content:""; width:10px; height:22px; border-radius:3px; flex:none;
    background:linear-gradient(var(--accent),#dda15e); box-shadow:0 0 0 3px rgba(255,255,255,.12);
  }
  header p{opacity:.82; font-size:0.83rem; max-width:60ch;}
  .titulo-mes input{ backdrop-filter:blur(4px); transition:background .2s var(--ease); }
  .titulo-mes input:focus{ background:rgba(255,255,255,.24); outline:none; }

  /* ---------- abas: controle segmentado ---------- */
  .abas{ gap:2px; background:rgba(255,255,255,.10); padding:4px; border-radius:12px;
    margin-top:16px; margin-bottom:14px; width:fit-content; max-width:100%;
    overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none; }
  .abas::-webkit-scrollbar{ display:none; }
  .aba{
    border-radius:9px; border:none; padding:8px 15px; font-size:0.88rem; font-weight:500;
    color:rgba(255,255,255,.72); transition:all .22s var(--ease); position:relative;
    white-space:nowrap; flex:none;
  }
  .aba:hover{ color:#fff; background:rgba(255,255,255,.10); }
  .aba.ativa{
    color:var(--green-deep); background:#fff; font-weight:600;
    box-shadow:0 2px 8px -2px rgba(0,0,0,.25); border-bottom:none;
  }

  /* ---------- toolbar / inputs / botoes ---------- */
  .toolbar{ position:static; background:rgba(255,255,255,.85); backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line); box-shadow:0 1px 0 rgba(255,255,255,.6) inset; }
  .toolbar input[type=text],.novo-item-form input,.novo-item-form select,.campo input,.campo select{
    border-radius:10px; border:1px solid var(--border); transition:border-color .18s var(--ease), box-shadow .18s var(--ease);
  }
  .toolbar input[type=text]:focus,.novo-item-form input:focus,.novo-item-form select:focus,
  .campo input:focus,.campo select:focus,.modal input:focus{
    outline:none; border-color:var(--green); box-shadow:0 0 0 3px var(--green-soft);
  }
  .btn{
    border-radius:10px; font-weight:500; transition:transform .12s var(--ease), background .18s var(--ease), box-shadow .18s var(--ease), border-color .18s var(--ease);
    box-shadow:var(--sh-sm);
  }
  .btn:hover{ background:var(--green-soft); border-color:#c5d6bd; }
  .btn:active{ transform:translateY(1px); }
  .btn:focus-visible{ outline:2px solid var(--green); outline-offset:2px; }
  .btn.primary{ background:linear-gradient(var(--green),#295030); box-shadow:0 6px 16px -8px rgba(46,90,52,.8); }
  .btn.primary:hover{ background:linear-gradient(#356139,#234527); }
  .btn.accent{ background:linear-gradient(var(--accent),#b06a24); box-shadow:0 6px 16px -8px rgba(199,125,51,.75); }
  .btn.accent:hover{ background:linear-gradient(#d0862f,#a2611f); }

  /* ---------- superficies com profundidade ---------- */
  .painel,.categoria,.compra-card,.comp-item,.var-item,.justa-card,.podio-card,
  .kpi,.plano-merc{ box-shadow:var(--sh-sm); transition:box-shadow .22s var(--ease), transform .22s var(--ease), border-color .22s var(--ease); }
  .painel{ border-radius:var(--r-lg); border-color:var(--line); }
  .painel:hover{ box-shadow:var(--sh); }
  .kpi{ border-radius:var(--r); background:linear-gradient(180deg,#fff, #fcfdfa); position:relative; overflow:hidden; }
  .kpi::before{ content:""; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--green); opacity:.85; }
  .kpi:hover{ transform:translateY(-2px); box-shadow:var(--sh); }
  .kpi .valor{ font-family:var(--display); font-weight:600; font-optical-sizing:auto; letter-spacing:-0.01em; }

  /* cards clicaveis/analiticos: leve elevacao no hover */
  .comp-item:hover,.var-item:hover,.compra-card:hover,.justa-card:hover,.podio-card:hover{
    transform:translateY(-2px); box-shadow:var(--sh);
  }

  /* rotulos: fora do CAIXA ALTA, viram etiquetas discretas */
  .kpi .rotulo,.col-tit{ text-transform:none; letter-spacing:0; font-size:0.78rem; color:var(--muted); font-weight:500; }

  /* titulos de painel com a serifa de exibicao */
  .painel h2{ font-family:var(--display); font-weight:600; font-size:1.08rem; letter-spacing:-0.01em; color:var(--green-deep); font-optical-sizing:auto; }

  /* ---------- lista: linhas com resposta ao hover ---------- */
  .cat-header{ transition:background .18s var(--ease); }
  .cat-header:hover{ filter:brightness(.98); }
  .item-row{ transition:background .15s var(--ease); border-radius:8px; }
  .item-row:hover{ background:var(--surface-2); }
  .qtd-box button,.preco-box input{ transition:all .15s var(--ease); }
  .qtd-box button:hover{ background:var(--green-soft); border-color:#c5d6bd; }
  .qtd-box button:active{ transform:scale(.9); }
  .tag-barato{ transition:transform .15s var(--ease); }
  .item-row:hover .tag-barato{ transform:translateX(2px); }

  /* ---------- chips / pontos ---------- */
  .merc-chip{ transition:transform .15s var(--ease), box-shadow .15s var(--ease); }
  .merc-chip.melhor{ box-shadow:0 2px 8px -3px rgba(63,122,74,.5); }
  .comp-item:hover .merc-chip.melhor{ transform:translateY(-1px); }
  .var-ponto{ transition:transform .15s var(--ease), box-shadow .18s var(--ease); }
  .var-ponto:hover{ transform:translateY(-2px); box-shadow:var(--sh-sm); }

  /* ---------- tabelas ---------- */
  table.hist tbody tr,table.comparativo tbody tr{ transition:background .15s var(--ease); }
  table.hist tbody tr:hover,table.comparativo tbody tr:hover{ background:var(--surface-2); }
  table.comparativo td.barato{ box-shadow:inset 0 0 0 1px #cfe3cf; }

  /* ---------- barras (grafico horizontal) ---------- */
  .barra-preenche{ position:relative; border-radius:5px;
    animation:crescerBarra .7s var(--ease) both; transform-origin:left center; }
  .barra-trilho{ background:#EEF1E9; }
  @keyframes crescerBarra{ from{ transform:scaleX(0); } to{ transform:scaleX(1); } }
  .stk-bar{ box-shadow:var(--sh-sm) inset; }
  .stk-seg{ transition:filter .15s var(--ease); }
  .stk-seg:hover{ filter:brightness(1.08) saturate(1.1); }

  /* SVG: barras e pontos reagem ao hover */
  svg.grafico rect,svg.grafico circle{ transition:opacity .15s var(--ease); }
  svg.grafico:hover rect{ opacity:.92; }
  svg.grafico rect:hover{ opacity:1; }

  /* ---------- entrada suave ao trocar de aba (um momento so) ---------- */
  #view-lista,#view-comparador,#view-variacao,#view-painel{ animation:entrar .32s var(--ease) both; }
  @keyframes entrar{ from{ opacity:0; transform:translateY(6px);} to{ opacity:1; transform:none;} }

  /* ---------- rodape ---------- */
  footer{ background:rgba(255,255,255,.92); backdrop-filter:blur(10px); border-top:1px solid var(--line); }
  .resumo b{ font-family:var(--display); font-weight:600; }

  /* ---------- modal ---------- */
  .modal{ border-radius:var(--r-lg); box-shadow:var(--sh-lg); animation:modalUp .25s var(--ease) both; }
  @keyframes modalUp{ from{ opacity:0; transform:translateY(10px) scale(.98);} to{ opacity:1; transform:none;} }
  .modal h3{ font-family:var(--display); font-weight:600; }

  /* respeito a quem prefere menos movimento */
  @media (prefers-reduced-motion:reduce){
    .barra-preenche,#view-lista,#view-comparador,#view-variacao,#view-painel,.modal{ animation:none !important; }
    *{ transition:none !important; }
  }
</style>
</head>

<header>
  <h1>Lista de Compras do Mes</h1>
  <p>Baseada na compra padrao do mercado. Marque o que precisa comprar e gere a lista final.</p>
  <div class="titulo-mes">
    <input type="text" id="mesRef" placeholder="Ex: Agosto/2026">
  </div>
  <div class="abas">
    <button class="aba ativa" id="aba-lista" onclick="trocarAba('lista')">Lista</button>
    <button class="aba" id="aba-comparador" onclick="trocarAba('comparador')">Comparador</button>
    <button class="aba" id="aba-variacao" onclick="trocarAba('variacao')">Variacao</button>
    <button class="aba" id="aba-painel" onclick="trocarAba('painel')">Painel</button>
  </div>
</header>

<!-- ================= LISTA ================= -->
<div id="view-lista">

  <div class="toolbar">
    <input type="text" id="busca" placeholder="Buscar item...">
    <button class="btn" onclick="marcarTodos(true)">Marcar todos</button>
    <button class="btn" onclick="marcarTodos(false)">Desmarcar todos</button>
    <button class="btn" onclick="resetarPadrao()">Restaurar padrao</button>
  </div>

  <main>
    <div id="lista"></div>

    <div class="categoria novo-item-card">
      <div class="cat-header">
        <span class="cat-title">+ Adicionar produto novo</span>
      </div>
      <div class="novo-item-form">
        <div class="campo produto">
          <label>Produto</label>
          <input type="text" id="novoDesc" placeholder="Ex: Papel toalha">
        </div>
        <div class="campo cat">
          <label>Categoria</label>
          <select id="novoCat"></select>
        </div>
        <div class="campo qtd">
          <label>Qtde</label>
          <input type="number" id="novoQtd" value="1" min="0" step="0.1">
        </div>
        <div class="campo un">
          <label>Unidade</label>
          <input type="text" id="novoUn" value="Un">
        </div>
        <div class="campo preco">
          <label>Preco est. (R$)</label>
          <input type="number" id="novoPreco" value="0" min="0" step="0.01">
        </div>
        <button class="btn primary" onclick="adicionarItem()">Adicionar a lista</button>
      </div>
    </div>
  </main>
</div>

<!-- ================= COMPARADOR ================= -->
<div id="view-comparador" class="hidden">
  <div class="toolbar">
    <input type="text" id="buscaComp" placeholder="Buscar produto...">
    <select id="ordemComp" class="btn">
      <option value="economia">Maior economia</option>
      <option value="nome">Nome (A-Z)</option>
      <option value="caro">Mais caro</option>
      <option value="recente">Comprado recentemente</option>
    </select>
    <label class="btn" style="display:flex;align-items:center;gap:6px;cursor:pointer">
      <input type="checkbox" id="soComparaveis" style="width:16px;height:16px;accent-color:var(--green)">
      so comparaveis
    </label>
  </div>
  <main>
    <div id="comparador"></div>
  </main>
</div>

<!-- ================= VARIACAO ================= -->
<div id="view-variacao" class="hidden">
  <div class="toolbar">
    <input type="text" id="buscaVar" placeholder="Buscar produto...">
    <select id="ordemVar" class="btn">
      <option value="variacao">Maior variacao</option>
      <option value="subiu">Mais subiu</option>
      <option value="desceu">Mais caiu</option>
      <option value="nome">Nome (A-Z)</option>
    </select>
  </div>
  <main>
    <div id="variacao"></div>
  </main>
</div>

<!-- ================= PAINEL ================= -->
<div id="view-painel" class="hidden">
  <main>
    <div id="dash"></div>
  </main>
</div>

<footer>
  <div class="resumo" id="rodape-resumo">
    <span id="contagem">0 itens selecionados</span> &middot; Total estimado: <b id="totalEstimado">R$ 0,00</b>
  </div>
  <div class="footer-actions" id="rodape-acoes">
    <button class="btn" onclick="baixarTexto()">Baixar .txt</button>
    <button class="btn" onclick="gerarPDF()">Gerar PDF</button>
    <button class="btn" onclick="exportarDados()" title="Salvar um backup dos seus dados">Backup</button>
    <label class="btn" title="Restaurar de um backup" style="cursor:pointer">Importar
      <input type="file" accept="application/json" onchange="importarDados(this)" style="display:none">
    </label>
    <button class="btn accent" onclick="abrirFecharCompra()">Fechar compra</button>
  </div>
</footer>

<div id="modal-root"></div>

/* cores de identidade dos mercados */
const CORES_MERCADO = { "assai":"#2C6BA0", "guanabara":"#E3AE2B" };
const _PALETA_MERCADO = ["#7A6A5A","#5FA8A0","#8C5E8C","#A6683D","#4A7C59","#B0555A"];
function corMercado(nome){
  const k = _semAcento(String(nome||'')).trim();
  if(CORES_MERCADO[k]) return CORES_MERCADO[k];
  let h = 0; for(let i=0;i<k.length;i++) h = (h*31 + k.charCodeAt(i)) >>> 0;
  return _PALETA_MERCADO[h % _PALETA_MERCADO.length];
}
// texto legivel sobre a cor do mercado (amarelo pede texto escuro)
function corTextoMercado(nome){
  const c = corMercado(nome);
  const r=parseInt(c.substr(1,2),16), g=parseInt(c.substr(3,2),16), b=parseInt(c.substr(5,2),16);
  return (0.299*r + 0.587*g + 0.114*b) > 150 ? '#5c4a12' : '#ffffff';
}
// bolinha colorida + nome do mercado
function selo(nome){
  return `<span class="mseloi" style="background:${corMercado(nome)}"></span>${esc(nome)}`;
}

    estimado,
    real: estimado,          // esses precos sao os da compra real no Assai

}

function _semAcento(s){ return s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase(); }
function _tamanho(desc){
  const d = _semAcento(desc);
  const re = /(\d+[.,]?\d*)\s*(kg|ml|lt|l|g)\b/g;
  let m, ult = null;
  while((m = re.exec(d)) !== null) ult = m;
  if(!ult) return null;
  let val = parseFloat(ult[1].replace('.','').replace(',','.'));
  if(isNaN(val)) val = parseFloat(ult[1].replace(',','.'));
  let un = ult[2];
  if(un === 'l' || un === 'lt'){ val *= 1000; un = 'ml'; }
  else if(un === 'kg'){ val *= 1000; un = 'g'; }
  return Math.round(val) + un;
}
const _TIPOS = ["pipoca de micro ondas", "agua com gas", "agua de coco", "creme de leite", "leite em po", "massa de pastel", "massa para pastel", "massa de lasanha", "oleo de soja", "farinha de rosca", "farinha de trigo", "farinha de mandioca", "molho de tomate", "extrato de tomate", "milho para pipoca", "amido de milho", "leite de coco", "sabao em po", "sabao em barra", "sabao de coco", "saco de lixo", "esponja de aco", "pano de chao", "escova de dente", "toalha de papel", "aparelho de barbear", "file de frango", "frango a passarinho", "asa de frango", "agua mineral", "leite condensado", "leite integral", "leite desnatado", "queijo parmesao", "queijo prato", "queijo mussarela", "arroz arborio", "arroz integral", "arroz parboilizado", "feijao preto", "feijao carioca", "feijao fradinho", "acucar refinado", "acucar cristal", "sal grosso", "macarrao instantaneo", "molho tare", "molho shoyu", "milho verde", "batata palha", "batata frita", "sabao liquido", "limpador multiuso", "limpa vidros", "pano multiuso", "desodorizador sanitario", "lustra moveis", "tira manchas", "agua sanitaria", "sabonete liquido", "creme dental", "fio dental", "papel higienico", "papel toalha", "toalha umedecida", "lenco umedecido", "protetor solar", "carne seca", "carne moida", "peito bovino", "copa lombo", "papel aluminio", "filme plastico", "copo descartavel", "prato descartavel", "refrigerante", "suco", "cerveja", "energetico", "manteiga", "margarina", "requeijao", "queijo", "iogurte", "presunto", "mortadela", "bacon", "azeite", "vinagre", "arroz", "feijao", "acucar", "sal", "farofa", "farinha", "macarrao", "molho", "pipoca", "ketchup", "catchup", "maionese", "mostarda", "mel", "tapioca", "fermento", "gelatina", "achocolatado", "cafe", "caldo", "tempero", "sardinha", "atum", "biscoito", "chocolate", "bombom", "bala", "salgadinho", "amendoim", "sabao", "amaciante", "detergente", "desinfetante", "alcool", "inseticida", "saponaceo", "limpador", "esponja", "odorizador", "alvejante", "cera", "sabonete", "shampoo", "condicionador", "desodorante", "absorvente", "fralda", "cotonete", "algodao", "hidratante", "acem", "alcatra", "fraldinha", "paleta", "costela", "picanha", "maminha", "patinho", "coxao", "frango", "coxa", "sobrecoxa", "linguica", "salsicha", "embutido", "bife", "carne", "sacola", "guardanapo", "fosforo", "vela", "pilha", "espiral", "lixeira", "pote", "touca", "luva", "alho"];
const _COMMODITIES = new Set(["acem", "acucar", "acucar cristal", "acucar refinado", "agua com gas", "agua de coco", "agua mineral", "agua sanitaria", "alcatra", "alcool", "amido de milho", "arroz", "arroz arborio", "arroz integral", "arroz parboilizado", "asa de frango", "carne moida", "carne seca", "copa lombo", "costela", "coxa", "coxao", "creme de leite", "detergente", "farinha de mandioca", "farinha de rosca", "farinha de trigo", "feijao", "feijao carioca", "feijao fradinho", "feijao preto", "fermento", "file de frango", "fraldinha", "frango", "frango a passarinho", "leite condensado", "leite desnatado", "leite integral", "maminha", "oleo de soja", "paleta", "papel toalha", "patinho", "peito bovino", "picanha", "queijo", "queijo mussarela", "queijo parmesao", "queijo prato", "sal", "sal grosso", "sobrecoxa", "tapioca", "toalha de papel", "vinagre"]);
const _SINON = {"catchup":"ketchup"};
function _tokens(desc){ return _semAcento(desc).split(/[^a-z]+/).filter(Boolean); }
function _tipoDe(desc){
  const toks=_tokens(desc);
  for(const t of _TIPOS){ const tt=t.split(' '), n=tt.length;
    for(let i=0;i+n<=toks.length;i++){ let ok=true; for(let j=0;j<n;j++){ if(toks[i+j]!==tt[j]){ok=false;break;} } if(ok) return _SINON[t]||t; } }
  return null;
}
function _pack(desc){
  const d=_semAcento(desc); const toks=new Set(); let m;
  const add=(re,fn)=>{ while((m=re.exec(d))!==null) toks.add(fn(m)); };
  add(/c\/\s*(\d+)/g, m=>'c'+m[1]); add(/l(\d+)p(\d+)/g, m=>'l'+m[1]+'p'+m[2]);
  add(/\b(\d+)\s*fl\b/g, m=>m[1]+'fl'); add(/\b(\d+)\s*f\b/g, m=>m[1]+'f');
  add(/\b(\d+)\s*rol/g, m=>m[1]+'rol'); add(/\blv?(\d+)\b/g, m=>'l'+m[1]); add(/\b(\d+)\s*un\b/g, m=>m[1]+'un');
  return [...toks].sort().join(' ');
}
function _descCompleta(desc){
  let d=' '+_semAcento(desc)+' ';
  d=d.replace(/\([^)]*\)/g,' ').replace(/\bpct\b/g,' ');
  d=d.replace(/\d+[.,]?\d*\s*(kg|ml|lt|l|g)\b/g,' ');
  d=d.replace(/c\/\s*\d+\s*un?|l\d+p\d+|c\/\d+|tp-?\d*|\bt1\b|\bn\d\b|\d+fl\b|\d+f\b|\d+rol\w*|\blv?\d+\b|\d+un\b|\bkg\b/g,' ');
  const ruido=new Set(['de','da','do','com','sem','the','o','a','pa']);
  const pal=d.split(/[^a-z]+/).filter(w=>w.length>=2 && !ruido.has(w));
  return pal.slice(0,4).join(' ');
}
// chave: commodities cruzam por marca (tipo+tamanho); demais ficam presos a marca/variacao (desc completa+tamanho)
function chaveProduto(desc){
  const tipo=_tipoDe(desc);
  const base=(tipo && _COMMODITIES.has(tipo)) ? tipo : _descCompleta(desc);
  const t=_tamanho(desc), pk=_pack(desc), suf=t||pk;
  return (suf ? (base+' '+suf) : base).trim();
}
// chave do item: calculada a partir da descricao (tipo de produto + tamanho),
// para que dados ja salvos tambem usem sempre a regra de cruzamento mais atual
function keyOf(it){ return (it && it.desc) ? chaveProduto(it.desc) : ((it && it.key) || ''); }

}

function toggleCat(headerEl){
  const body = headerEl.parentElement.querySelector('.cat-body');
  body.classList.toggle('hidden');
}

function onCheck(id, checked){
  const it = state.find(i=>i.id===id);
  it.checked = checked;
  render();
}

function alterarQtd(id, delta){
  const it = state.find(i=>i.id===id);
  let novo = Math.round((parseFloat(it.qtdAtual) + delta) * 100) / 100;
  if(novo < 0) novo = 0;
  it.qtdAtual = novo;
  if(novo > 0) it.checked = true;
  render();
}

function setQtd(id, val){
  const it = state.find(i=>i.id===id);
  let v = parseFloat(val);
  if(isNaN(v) || v < 0) v = 0;
  it.qtdAtual = v;
  if(v > 0) it.checked = true;
  render();
}

function setPreco(id, val){
  const it = state.find(i=>i.id===id);
  let v = parseFloat(String(val).replace(',','.'));
  if(isNaN(v) || v < 0) v = 0;
  it.preco = v;
  render();
}

function marcarCategoria(cat){
  state.filter(i=>i.cat===cat).forEach(i=>i.checked = true);
  render();
}
function desmarcarCategoria(cat){
  state.filter(i=>i.cat===cat).forEach(i=>i.checked = false);
  render();
}
function marcarTodos(v){
  state.forEach(i=>i.checked = v);
  render();
}
function resetarPadrao(){
  state = state.filter(i => !i.custom);
  state.forEach(i=>{ i.qtdAtual = i.qtd; i.checked = false; });
  render();
}

function adicionarItem(){
  const desc = document.getElementById('novoDesc').value.trim();
  if(!desc){ alert('Digite o nome do produto.'); return; }
  const cat = document.getElementById('novoCat').value;
  let qtd = parseFloat(document.getElementById('novoQtd').value);
  if(isNaN(qtd) || qtd <= 0) qtd = 1;
  const un = document.getElementById('novoUn').value.trim() || 'Un';
  let preco = parseFloat(document.getElementById('novoPreco').value);
  if(isNaN(preco) || preco < 0) preco = 0;

  state.push({ id: proximoId++, desc, cat, qtd, un, preco, qtdAtual: qtd, checked: true, custom: true });

  document.getElementById('novoDesc').value = '';
  document.getElementById('novoQtd').value = '1';
  document.getElementById('novoUn').value = 'Un';
  document.getElementById('novoPreco').value = '0';
  document.getElementById('novoDesc').focus();
  render();
}

function removerItem(id){
  state = state.filter(i => i.id !== id);
  render();
}

function atualizarResumo(){
  const selecionados = state.filter(i=>i.checked && i.qtdAtual > 0);

function listaFinal(){
  const grupos = {};
  CATEGORIAS_ORDEM.forEach(c => grupos[c] = []);
  state.filter(i=>i.checked && i.qtdAtual > 0).forEach(i => grupos[i.cat].push(i));
  return grupos;
}

// procura, do historico mais recente para o mais antigo, o ultimo preco unitario pago neste produto
function ultimoPrecoPago(item){
  const alvo = keyOf(item);
  for(let k = historico.length - 1; k >= 0; k--){
    const it = (historico[k].itens || []).find(x => keyOf(x) === alvo);
    if(it && it.preco != null) return {preco: it.preco, onde: historico[k].mercado || historico[k].mes || ''};
  }
  return null;
}

function baixarTexto(){
  const mes = document.getElementById('mesRef').value.trim() || 'proxima compra';
  const grupos = listaFinal();
  let linhas = [`LISTA DE COMPRAS - ${mes.toUpperCase()}`, ''];
  let total = 0;
  CATEGORIAS_ORDEM.forEach(cat => {
    const itens = grupos[cat];
    if(!itens || itens.length === 0) return;
    linhas.push(`== ${cat} ==`);
    itens.forEach(i => {
      const ult = ultimoPrecoPago(i);
      const nota = ult ? `  (ult.: R$ ${ult.preco.toFixed(2).replace('.', ',')})` : '';
      linhas.push(`[ ] ${i.desc} - ${i.qtdAtual} ${i.un}${nota}`);
      total += i.qtdAtual * i.preco;
    });
    linhas.push('');
  });
  linhas.push(`Total estimado: R$ ${total.toFixed(2).replace('.', ',')}`);
  const blob = new Blob([linhas.join('\n')], {type:'text/plain;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `lista_compras_${mes.replace(/\s+/g,'_')}.txt`;
  a.click();
}

function gerarPDF(){
  const mes = document.getElementById('mesRef').value.trim() || 'Proxima Compra';
  const grupos = listaFinal();
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  let y = 18;
  doc.setFontSize(16);
  doc.text(`Lista de Compras - ${mes}`, 14, y);
  y += 6;
  doc.setFontSize(9);
  doc.setTextColor(120);
  doc.text(`Gerado em ${new Date().toLocaleDateString('pt-BR')}`, 14, y);
  doc.setTextColor(0);
  y += 10;

  const temHistorico = historico.length > 0;
  const xPreco = 196; // borda direita util (A4 = 210mm)

  // cabecalho de coluna do preco
  if(temHistorico){
    doc.setFontSize(8);
    doc.setTextColor(150);
    doc.text('ult. preco pago', xPreco, y - 2, {align:'right'});
    doc.setTextColor(0);
  }

  let total = 0;
  CATEGORIAS_ORDEM.forEach(cat => {
    const itens = grupos[cat];
    if(!itens || itens.length === 0) return;
    if(y > 270){ doc.addPage(); y = 18; }
    doc.setFontSize(12);
    doc.setFont(undefined, 'bold');
    doc.text(cat, 14, y);
    doc.setFont(undefined, 'normal');
    y += 6;
    doc.setFontSize(10);
    itens.forEach(i => {
      if(y > 285){ doc.addPage(); y = 18; }
      doc.text(`[ ]  ${i.desc}  -  ${i.qtdAtual} ${i.un}`, 18, y);
      const ult = ultimoPrecoPago(i);
      if(ult){
        doc.setTextColor(90);
        doc.text(`R$ ${ult.preco.toFixed(2).replace('.', ',')}`, xPreco, y, {align:'right'});
        doc.setTextColor(0);
      }
      total += i.qtdAtual * i.preco;
      y += 6;
    });
    y += 4;
  });

  if(y > 270){ doc.addPage(); y = 18; }
  doc.setFont(undefined, 'bold');
  doc.text(`Total estimado: R$ ${total.toFixed(2).replace('.', ',')}`, 14, y + 4);
  if(!temHistorico){
    doc.setFont(undefined, 'normal');
    doc.setFontSize(8);
    doc.setTextColor(150);
    doc.text('feche a primeira compra para o PDF passar a mostrar o preco pago em cada item', 14, y + 11);
    doc.setTextColor(0);
  }

  doc.save(`lista_compras_${mes.replace(/\s+/g,'_')}.pdf`);
}

  const mes = document.getElementById('m-mes').value.trim();
  const estimado = totalDaLista();
  let real = parseFloat(document.getElementById('m-real').value);
  if(isNaN(real) || real < 0) real = null;

  const selecionados = state.filter(i=>i.checked && i.qtdAtual > 0);

  historico.push({
    id: Date.now(),
    mercado,
    mes,
    data: new Date().toISOString(),
    estimado,
    real,
    nItens: selecionados.length,
    porCategoria: gastoPorCategoria(),
    itens: selecionados.map(i => ({desc:i.desc, cat:i.cat, qtd:i.qtdAtual, un:i.un, preco:i.preco}))
  });

  if(mes) document.getElementById('mesRef').value = mes;
  salvar();
  fecharModal();
  trocarAba('painel');
}

function rotuloCompra(c){
  return c.mercado || c.mes || 'Compra';
}

function removerCompra(id){
  const c = historico.find(h=>h.id===id);
  if(!confirm(`Remover a compra de ${rotuloCompra(c)} do historico?`)) return;
  historico = historico.filter(h => h.id !== id);
  salvar();
  renderDash();
}

function editarReal(id){
  const c = historico.find(h=>h.id===id);
  const v = prompt(`Valor real da compra em ${rotuloCompra(c)} (R$):`, c.real != null ? c.real : '');
  if(v === null) return;
  const n = parseFloat(String(v).replace(',','.'));
  c.real = (isNaN(n) || n < 0) ? null : n;
  salvar();
  renderDash();
}

function editarMercado(id){
  const c = historico.find(h=>h.id===id);
  const v = prompt('Nome do mercado:', c.mercado || '');
  if(v === null) return;
  c.mercado = v.trim();
  salvar();
  render();
  renderDash();
}

function barrasHorizontais(dados, corFn){
  if(dados.length === 0) return '';
  const max = Math.max(...dados.map(d=>d.valor));
  return dados.map(d => `
    <div class="barra-linha">
      <div class="barra-topo">
        <span class="nome">${esc(d.nome)}</span>
        <span class="val">${brl(d.valor)}${d.extra ? ' &middot; ' + esc(d.extra) : ''}</span>
      </div>
      <div class="barra-trilho">
        <div class="barra-preenche" style="width:${max > 0 ? (d.valor/max*100) : 0}%; background:${corFn(d)}"></div>
      </div>
    </div>
  `).join('');
}

function graficoLinha(pontos){
  const W = 640, H = 240, ml = 62, mr = 16, mt = 18, mb = 42;
  const iw = W - ml - mr, ih = H - mt - mb;
  const vals = pontos.map(p=>p.valor);
  const maxV = Math.max(...vals) * 1.12;
  const minV = 0;
  const x = i => pontos.length === 1 ? ml + iw/2 : ml + (i/(pontos.length-1))*iw;
  const y = v => mt + ih - ((v - minV)/(maxV - minV || 1))*ih;

  let grades = '', rotulos = '';
  for(let k=0; k<=4; k++){
    const v = minV + (maxV-minV)*k/4;
    const yy = y(v);
    grades += `<line x1="${ml}" y1="${yy}" x2="${W-mr}" y2="${yy}" stroke="#EDEFE9" stroke-width="1"/>`;
    rotulos += `<text x="${ml-8}" y="${yy+4}" text-anchor="end" font-size="10" fill="#6b7566">${Math.round(v)}</text>`;
  }

  const d = pontos.map((p,i)=> `${i===0?'M':'L'}${x(i)},${y(p.valor)}`).join(' ');
  const area = `M${x(0)},${mt+ih} ` + pontos.map((p,i)=> `L${x(i)},${y(p.valor)}`).join(' ') + ` L${x(pontos.length-1)},${mt+ih} Z`;

  const pts = pontos.map((p,i)=> `
    <circle cx="${x(i)}" cy="${y(p.valor)}" r="4.5" fill="#fff" stroke="#2F5233" stroke-width="2.5"/>
    <text x="${x(i)}" y="${y(p.valor)-11}" text-anchor="middle" font-size="10" font-weight="600" fill="#2F5233">${p.valor.toFixed(0)}</text>
    <text x="${x(i)}" y="${H-14}" text-anchor="middle" font-size="10" fill="#6b7566">${esc(p.rotulo)}</text>
  `).join('');

  return `<svg class="grafico" viewBox="0 0 ${W} ${H}" role="img" aria-label="Evolucao do total mes a mes">
    ${grades}${rotulos}
    ${pontos.length > 1 ? `<path d="${area}" fill="#2F5233" opacity="0.07"/>` : ''}
    ${pontos.length > 1 ? `<path d="${d}" fill="none" stroke="#2F5233" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>` : ''}
    ${pts}
    <text x="${ml-8}" y="${mt-6}" text-anchor="end" font-size="9" fill="#9AA396">R$</text>
  </svg>`;
}

function graficoEstimadoReal(compras){
  const W = 640, H = 250, ml = 62, mr = 16, mt = 18, mb = 52;
  const iw = W - ml - mr, ih = H - mt - mb;
  const maxV = Math.max(...compras.flatMap(c => [c.estimado, c.real || 0])) * 1.12 || 1;
  const y = v => mt + ih - (v/maxV)*ih;
  const passo = iw / compras.length;
  const larg = Math.min(26, passo/3);

  let grades = '', rotulos = '';
  for(let k=0; k<=4; k++){
    const v = maxV*k/4, yy = y(v);
    grades += `<line x1="${ml}" y1="${yy}" x2="${W-mr}" y2="${yy}" stroke="#EDEFE9" stroke-width="1"/>`;
    rotulos += `<text x="${ml-8}" y="${yy+4}" text-anchor="end" font-size="10" fill="#6b7566">${Math.round(v)}</text>`;
  }

  const barras = compras.map((c,i) => {
    const cx = ml + passo*i + passo/2;
    const xe = cx - larg - 2, xr = cx + 2;
    const he = (mt+ih) - y(c.estimado);
    const hr = c.real != null ? (mt+ih) - y(c.real) : 0;
    return `
      <rect x="${xe}" y="${y(c.estimado)}" width="${larg}" height="${he}" fill="#9AA396" rx="3"/>
      ${c.real != null ? `<rect x="${xr}" y="${y(c.real)}" width="${larg}" height="${hr}" fill="#C97B2E" rx="3"/>` : ''}
      <text x="${cx}" y="${H-30}" text-anchor="middle" font-size="10" fill="#6b7566">${esc(c.mes)}</text>
      ${c.real != null ? `<text x="${cx}" y="${H-16}" text-anchor="middle" font-size="9" font-weight="600" fill="${c.real > c.estimado ? '#A63D40' : '#3f7a4a'}">${c.real > c.estimado ? '+' : ''}${(c.real-c.estimado).toFixed(0)}</text>` : `<text x="${cx}" y="${H-16}" text-anchor="middle" font-size="9" fill="#9AA396">sem real</text>`}
    `;
  }).join('');

  return `<svg class="grafico" viewBox="0 0 ${W} ${H}" role="img" aria-label="Estimado contra gasto real por mes">
    ${grades}${rotulos}${barras}
    <text x="${ml-8}" y="${mt-6}" text-anchor="end" font-size="9" fill="#9AA396">R$</text>
  </svg>`;
}

// valor base de uma compra: real quando informado, senao estimado
function valorBase(c){ return c.real != null ? c.real : c.estimado; }

// grafico de barras verticais comparando o total de cada compra (mercado)
function graficoComparacaoCompras(compras){
  const W = 660, H = 300, ml = 56, mr = 16, mt = 22, mb = 62;
  const iw = W - ml - mr, ih = H - mt - mb;
  const valores = compras.map(valorBase);
  const maxV = Math.max(...valores) * 1.15 || 1;
  const min = Math.min(...valores), max = Math.max(...valores);
  const y = v => mt + ih - (v/maxV)*ih;
  const passo = iw / compras.length;
  const larg = Math.min(64, passo*0.55);

  let grades = '', rotulos = '';
  for(let k=0; k<=4; k++){
    const v = maxV*k/4, yy = y(v);
    grades += `<line x1="${ml}" y1="${yy}" x2="${W-mr}" y2="${yy}" stroke="#EDEFE9" stroke-width="1"/>`;
    rotulos += `<text x="${ml-8}" y="${yy+4}" text-anchor="end" font-size="10" fill="#6b7566">${Math.round(v)}</text>`;
  }

  const barras = compras.map((c,i) => {
    const v = valorBase(c);
    const cx = ml + passo*i + passo/2;
    const x0 = cx - larg/2;
    const h = (mt+ih) - y(v);
    const ehMin = v === min && max !== min;
    const ehMax = v === max && max !== min;
    const cor = ehMin ? '#3f7a4a' : (ehMax ? '#A63D40' : '#C97B2E');
    const difMin = v - min;
    const nomeCurto = (c.mercado || c.mes || 'Compra').slice(0, 14);
    return `
      <rect x="${x0}" y="${y(v)}" width="${larg}" height="${h}" fill="${cor}" rx="4"/>
      <text x="${cx}" y="${y(v)-8}" text-anchor="middle" font-size="12" font-weight="700" fill="${cor}">${v.toFixed(0)}</text>
      <text x="${cx}" y="${H-38}" text-anchor="middle" font-size="11" font-weight="600" fill="#22301E">${esc(nomeCurto)}</text>
      ${c.mes ? `<text x="${cx}" y="${H-24}" text-anchor="middle" font-size="9" fill="#9AA396">${esc(c.mes.slice(0,16))}</text>` : ''}
      <text x="${cx}" y="${H-10}" text-anchor="middle" font-size="10" font-weight="600" fill="${ehMin ? '#3f7a4a' : '#A63D40'}">${ehMin ? 'mais barato' : '+' + difMin.toFixed(0)}</text>
    `;
  }).join('');

  return `<svg class="grafico" viewBox="0 0 ${W} ${H}" role="img" aria-label="Comparativo de total entre compras">
    ${grades}${rotulos}${barras}
    <text x="${ml-8}" y="${mt-8}" text-anchor="end" font-size="9" fill="#9AA396">R$</text>
  </svg>`;
}

// tabela categoria x compras, destacando o mais barato de cada linha
function tabelaComparativa(compras){
  const cats = CATEGORIAS_ORDEM.filter(cat =>
    compras.some(c => (c.porCategoria||{})[cat] > 0));
  if(cats.length === 0) return '';

  let head = '<tr><th>Categoria</th>' +
    compras.map(c => `<th><span class="mseloi" style="background:${corMercado(c.mercado||c.mes)}"></span>${esc((c.mercado || c.mes || 'Compra').slice(0,16))}</th>`).join('') + '</tr>';

  let linhas = cats.map(cat => {
    const vals = compras.map(c => (c.porCategoria||{})[cat] || 0);
    const positivos = vals.filter(v => v > 0);
    const menor = positivos.length ? Math.min(...positivos) : null;
    const celulas = vals.map(v =>
      `<td class="${(menor != null && v === menor && v > 0 && positivos.length > 1) ? 'barato' : ''}">${v > 0 ? brl(v) : '—'}</td>`
    ).join('');
    return `<tr><td>${esc(cat)}</td>${celulas}</tr>`;
  }).join('');

  const totais = compras.map(c => valorBase(c));
  const menorTotal = Math.min(...totais);
  const linhaTotal = `<tr class="total-row"><td>Total pago</td>` +
    totais.map(t => `<td class="${(t === menorTotal && totais.length > 1) ? 'barato' : ''}">${brl(t)}</td>`).join('') +
    '</tr>';

  return `<div class="tabela-rolagem"><table class="comparativo"><thead>${head}</thead><tbody>${linhas}${linhaTotal}</tbody></table></div>`;
}

// COMPARACAO JUSTA: para cada compra, compara so os itens em comum com a compra
// mais completa (o estoque inicial), usando as MESMAS quantidades dos dois lados.
function comparacaoJusta(){
  if(historico.length < 2) return null;
  const ref = historico.reduce((a,b)=> (b.itens||[]).length > (a.itens||[]).length ? b : a);
  const refPrecos = {};
  (ref.itens||[]).forEach(it => {
    const k = keyOf(it);
    if(refPrecos[k] == null || it.preco < refPrecos[k]) refPrecos[k] = it.preco;
  });

  const comparacoes = historico.filter(c => c.id !== ref.id).map(c => {
    let custoAqui = 0, custoRef = 0, comum = 0, vitorias = 0, soAqui = 0;
    (c.itens||[]).forEach(it => {
      const k = keyOf(it);
      if(refPrecos[k] != null){
        comum++;
        custoAqui += it.qtd * it.preco;
        custoRef  += it.qtd * refPrecos[k];
        if(it.preco < refPrecos[k]) vitorias++;
      } else { soAqui++; }
    });
    return {
      mercado: c.mercado || c.mes || 'compra', mes: c.mes,
      comum, soAqui, custoAqui, custoRef,
      dif: custoAqui - custoRef, vitorias
    };
  });
  return {ref, comparacoes};
}

   NOVOS RECURSOS: comparador de precos, cesta otimizada, visao geral,
   backup/restauracao de dados

function nomeLimpoProduto(desc){
  return String(desc).replace(/\s*\(pct\s*\d+\)\s*/gi,'').trim();
}

// agrega o historico por produto (chave produto+tamanho)
function dadosComparador(){
  const mapa = {};
  historico.forEach(c => {
    const merc = c.mercado || c.mes || 'compra';
    (c.itens || []).forEach(it => {
      if(it.preco == null) return;
      const k = keyOf(it);
      if(!mapa[k]) mapa[k] = {key:k, cat:it.cat, entradas:[], nomes:{}};
      mapa[k].entradas.push({mercado:merc, preco:it.preco, data:c.data});
      mapa[k].nomes[nomeLimpoProduto(it.desc)] = (mapa[k].nomes[nomeLimpoProduto(it.desc)]||0)+1;
    });
  });
  return Object.values(mapa).map(p => {
    const porMerc = {};
    p.entradas.forEach(e => {
      if(porMerc[e.mercado] == null || e.preco < porMerc[e.mercado].preco)
        porMerc[e.mercado] = {preco:e.preco, data:e.data};
    });
    const mercados = Object.entries(porMerc)
      .map(([m,v]) => ({mercado:m, preco:v.preco, data:v.data}))
      .sort((a,b)=> a.preco - b.preco);
    const menor = mercados[0], maior = mercados[mercados.length-1];
    const nome = Object.keys(p.nomes).sort((a,b)=> a.length - b.length)[0];
    const ultimaData = p.entradas.reduce((m,e)=> e.data > m ? e.data : m, '');
    return {
      key:p.key, nome, cat:p.cat, mercados, menor, maior, nMerc:mercados.length,
      economia: maior.preco - menor.preco,
      pct: menor.preco > 0 ? (maior.preco - menor.preco)/menor.preco*100 : 0,
      ultimaData
    };
  });
}

// produtos presentes em 2+ COMPRAS distintas, com o valor em cada compra e a variacao
function dadosVariacao(){
  const mapa = {};
  historico.forEach(c => {
    (c.itens || []).forEach(it => {
      if(it.preco == null) return;
      const k = keyOf(it);
      if(!mapa[k]) mapa[k] = {key:k, cat:it.cat, nomes:{}, entradas:{}};
      mapa[k].nomes[nomeLimpoProduto(it.desc)] = (mapa[k].nomes[nomeLimpoProduto(it.desc)]||0)+1;
      // por compra: menor preco daquele item na compra
      const e = mapa[k].entradas[c.id];
      if(!e || it.preco < e.preco) mapa[k].entradas[c.id] = {compraId:c.id, mercado:c.mercado||c.mes||'compra', data:c.data, mes:c.mes, preco:it.preco};
    });
  });
  return Object.values(mapa)
    .map(p => {
      const pontos = Object.values(p.entradas).sort((a,b)=> (a.data||'').localeCompare(b.data||''));
      const primeiro = pontos[0], ultimo = pontos[pontos.length-1];
      const precos = pontos.map(x=>x.preco);
      const min = Math.min(...precos), max = Math.max(...precos);
      const menor = pontos.find(x=>x.preco===min), maior = pontos.find(x=>x.preco===max);
      const nome = Object.keys(p.nomes).sort((a,b)=> a.length-b.length)[0];
      return {
        key:p.key, nome, cat:p.cat, pontos, nCompras: pontos.length,
        primeiro, ultimo, min, max, menor, maior,
        varAbs: ultimo.preco - primeiro.preco,
        varPct: primeiro.preco>0 ? (ultimo.preco - primeiro.preco)/primeiro.preco*100 : 0,
        spread: max - min
      };
    })
    .filter(p => p.nCompras >= 2);
}

function _dataCurta(iso){
  try { const d = new Date(iso); return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',year:'2-digit'}); }
  catch(e){ return ''; }
}

function renderVariacao(){
  const el = document.getElementById('variacao');
  if(historico.length < 2){
    el.innerHTML = `<div class="painel"><div class="vazio"><b>Poucas compras ainda</b>Esta aba compara o preco de um mesmo produto entre compras diferentes. Feche pelo menos duas compras para ela ganhar vida.</div></div>`;
    return;
  }
  let dados = dadosVariacao();
  const subiram = dados.filter(p=>p.varAbs > 0.001).length;
  const desceram = dados.filter(p=>p.varAbs < -0.001).length;

  const termo = (document.getElementById('buscaVar').value||'').trim().toLowerCase();
  const ordem = document.getElementById('ordemVar').value;
  let lista = dados.slice();
  if(termo) lista = lista.filter(p => p.nome.toLowerCase().includes(termo) || p.cat.toLowerCase().includes(termo));
  lista.sort((a,b)=>{
    if(ordem==='nome') return a.nome.localeCompare(b.nome);
    if(ordem==='subiu') return b.varAbs - a.varAbs;
    if(ordem==='desceu') return a.varAbs - b.varAbs;
    return Math.abs(b.varAbs) - Math.abs(a.varAbs); // maior variacao
  });

  let html = `
    <div class="kpis" style="margin-top:14px">
      <div class="kpi"><div class="rotulo">Produtos com historico</div><div class="valor">${dados.length}</div><div class="nota">em 2+ compras</div></div>
      <div class="kpi"><div class="rotulo">Subiram de preco</div><div class="valor" style="color:var(--red)">${subiram}</div><div class="nota">da 1a para a ultima compra</div></div>
      <div class="kpi"><div class="rotulo">Cairam de preco</div><div class="valor" style="color:#3f7a4a">${desceram}</div><div class="nota">da 1a para a ultima compra</div></div>
    </div>`;

  if(lista.length === 0){
    html += `<div class="painel"><div class="vazio"><b>Nada encontrado</b>Ajuste a busca.</div></div>`;
    el.innerHTML = html; return;
  }

  html += '<div class="var-lista">';
  lista.forEach(p => {
    const pontos = p.pontos.map(x => {
      const ehMin = x.preco === p.min && p.min !== p.max;
      const ehMax = x.preco === p.max && p.min !== p.max;
      return `<div class="var-ponto ${ehMin?'min':(ehMax?'max':'')}">
        <div class="vp-merc"><span class="mseloi" style="background:${corMercado(x.mercado)}"></span>${esc(x.mercado)}</div>
        <div class="vp-data">${esc(x.mes ? x.mes : _dataCurta(x.data))}</div>
        <div class="vp-preco">${brl(x.preco)}</div>
      </div>`;
    }).join('<div class="var-seta">&rsaquo;</div>');

    const subiu = p.varAbs > 0.001, caiu = p.varAbs < -0.001;
    const veredito = subiu
      ? `<span class="var-tag sobe">▲ subiu ${brl(p.varAbs)} (${p.varPct.toFixed(0)}%)</span>`
      : caiu ? `<span class="var-tag desce">▼ caiu ${brl(-p.varAbs)} (${Math.abs(p.varPct).toFixed(0)}%)</span>`
      : `<span class="var-tag igual">sem mudanca no total</span>`;
    const spreadTxt = p.spread > 0.001
      ? `menor ${brl(p.min)} (${esc(p.menor.mercado)}, ${esc(p.menor.mes||_dataCurta(p.menor.data))}) &middot; maior ${brl(p.max)}`
      : `mesmo preco nas ${p.nCompras} compras`;

    html += `
      <div class="var-item">
        <div class="var-topo">
          <div class="var-nome">${esc(p.nome)}<span class="comp-cat">${esc(p.cat)}</span></div>
          ${veredito}
        </div>
        <div class="var-linha">${pontos}</div>
        <div class="var-rodape">1a compra ${brl(p.primeiro.preco)} &rarr; ultima ${brl(p.ultimo.preco)} &middot; ${spreadTxt}</div>
      </div>`;
  });
  html += '</div>';
  el.innerHTML = html;
}

function renderComparador(){
  const el = document.getElementById('comparador');
  if(historico.length === 0){
    el.innerHTML = `<div class="painel"><div class="vazio"><b>Sem dados ainda</b>Feche pelo menos uma compra para o comparador comecar a montar o historico de precos por produto.</div></div>`;
    return;
  }
  let dados = dadosComparador();
  const comparaveis = dados.filter(d => d.nMerc >= 2);
  const economiaPotencial = comparaveis.reduce((s,d)=> s + d.economia, 0);

  // controles
  const termo = (document.getElementById('buscaComp').value||'').trim().toLowerCase();
  const ordem = document.getElementById('ordemComp').value;
  const soComp = document.getElementById('soComparaveis').checked;

  let lista = dados.slice();
  if(soComp) lista = lista.filter(d => d.nMerc >= 2);
  if(termo) lista = lista.filter(d => d.nome.toLowerCase().includes(termo) || d.cat.toLowerCase().includes(termo));
  lista.sort((a,b)=>{
    if(ordem === 'nome') return a.nome.localeCompare(b.nome);
    if(ordem === 'caro') return b.maior.preco - a.maior.preco;
    if(ordem === 'recente') return (b.ultimaData||'').localeCompare(a.ultimaData||'');
    return (b.economia - a.economia) || a.nome.localeCompare(b.nome); // economia
  });

  let html = `
    <div class="kpis" style="margin-top:14px">
      <div class="kpi">
        <div class="rotulo">Produtos monitorados</div>
        <div class="valor">${dados.length}</div>
        <div class="nota">em ${historico.length} compra${historico.length===1?'':'s'}</div>
      </div>
      <div class="kpi">
        <div class="rotulo">Comparaveis</div>
        <div class="valor">${comparaveis.length}</div>
        <div class="nota">comprados em 2+ mercados</div>
      </div>
      <div class="kpi">
        <div class="rotulo">Economia por unidade</div>
        <div class="valor">${brl(economiaPotencial)}</div>
        <div class="nota">somando a diferenca de cada produto comparavel</div>
      </div>
    </div>`;

  if(lista.length === 0){
    html += `<div class="painel"><div class="vazio"><b>Nada encontrado</b>Ajuste a busca ou desmarque "so comparaveis".</div></div>`;
    el.innerHTML = html; return;
  }

  html += '<div class="comp-lista">';
  lista.forEach(d => {
    const chips = d.mercados.map((m,i) => {
      const melhor = i === 0 && d.nMerc > 1;
      const pior = i === d.mercados.length-1 && d.nMerc > 1;
      return `<span class="merc-chip ${melhor?'melhor':(pior?'pior':'')}"><span class="mseloi" style="background:${corMercado(m.mercado)}"></span>${esc(m.mercado)} <b>${brl(m.preco)}</b></span>`;
    }).join('');
    const veredito = d.nMerc >= 2
      ? `<span class="comp-econ">mais barato no <b>${selo(d.menor.mercado)}</b> &middot; economiza ${brl(d.economia)} (${d.pct.toFixed(0)}%)</span>`
      : `<span class="comp-uni">so comprado no ${selo(d.mercados[0].mercado)} ate agora</span>`;
    html += `
      <div class="comp-item">
        <div class="comp-topo">
          <div class="comp-nome">${esc(d.nome)}<span class="comp-cat">${esc(d.cat)}</span></div>
        </div>
        <div class="merc-chips">${chips}</div>
        <div class="comp-rodape">${veredito}</div>
      </div>`;
  });
  html += '</div>';
  el.innerHTML = html;
}

// custo da lista marcada em cada mercado + cesta otimizada (comprar cada item onde e mais barato)
function cestaOtimizada(){
  const marcados = state.filter(i=>i.checked && i.qtdAtual > 0);
  if(marcados.length === 0 || historico.length === 0) return null;

  const precoMerc = {}; // key -> {mercado: menorPreco}
  historico.forEach(c => {
    const m = c.mercado || c.mes || 'compra';
    (c.itens||[]).forEach(it => {
      if(it.preco == null) return;
      const k = keyOf(it);
      precoMerc[k] = precoMerc[k] || {};
      if(precoMerc[k][m] == null || it.preco < precoMerc[k][m]) precoMerc[k][m] = it.preco;
    });
  });

  const mercados = [...new Set(historico.map(c => c.mercado || c.mes || 'compra'))];
  const totMerc = {}; mercados.forEach(m => totMerc[m] = 0);
  let totalOtimo = 0, itensSemPreco = 0;
  const plano = {};

  marcados.forEach(it => {
    const k = keyOf(it), pm = precoMerc[k] || {};
    mercados.forEach(m => { const p = pm[m] != null ? pm[m] : it.preco; totMerc[m] += it.qtdAtual * p; });
    let best = null;
    Object.entries(pm).forEach(([m,p]) => { if(best == null || p < best.preco) best = {mercado:m, preco:p}; });
    if(best == null){ best = {mercado:'—', preco: it.preco}; itensSemPreco++; }
    totalOtimo += it.qtdAtual * best.preco;
    (plano[best.mercado] = plano[best.mercado] || []).push({nome:nomeLimpoProduto(it.desc), qtd:it.qtdAtual, un:it.un, preco:best.preco});
  });

  const totaisMerc = mercados.map(m => ({mercado:m, total:totMerc[m]})).sort((a,b)=> a.total - b.total);
  const melhorUnico = totaisMerc[0];
  return {totaisMerc, totalOtimo, melhorUnico, economia: melhorUnico.total - totalOtimo, plano, itensSemPreco, nMerc: mercados.length};
}

function detalheCompra(c){
  const total = valorBase(c);
  const cats = {};
  (c.itens||[]).forEach(it => { if(it.preco==null) return; cats[it.cat] = (cats[it.cat]||0) + it.qtd*it.preco; });
  const catsOrd = Object.entries(cats).map(([nome,valor])=>({nome,valor})).sort((a,b)=> b.valor - a.valor);
  const tops = (c.itens||[]).map(it => ({nome:nomeLimpoProduto(it.desc), valor:it.qtd*it.preco, qtd:it.qtd, un:it.un}))
    .sort((a,b)=> b.valor - a.valor).slice(0,5);
  const somaItens = (c.itens||[]).reduce((s,it)=> s + (it.preco!=null? it.qtd*it.preco:0), 0) || 1;
  return {total, somaItens, nItens:c.nItens, ticket: c.nItens ? total/c.nItens : 0, catsOrd, tops};
}

  if(co.nMerc < 2){

        <div class="plano-itens">${itens.map(i=>`<span class="plano-item">${esc(i.nome)} <i>${i.qtd % 1 === 0 ? i.qtd : i.qtd.toFixed(3)} ${esc(i.un)}</i></span>`).join('')}</div>
      </div>`;
    }).join('');
    corpo = `
      <div class="otim-destaque ${temGanho?'ganho':''}">

          ? `Comprando cada item no mercado mais barato, sua lista sai por <b>${brl(co.totalOtimo)}</b> &mdash; contra <b>${brl(co.melhorUnico.total)}</b> comprando tudo no ${selo(co.melhorUnico.mercado)}. Economia de <b>${brl(co.economia)}</b>.`
          : `Neste momento, comprar tudo no ${selo(co.melhorUnico.mercado)} (${brl(co.melhorUnico.total)}) ja e o melhor cenario para esta lista.`}

      </div>
      ${barras}

  }
  return `<div class="painel">
    <h2>Cesta otimizada</h2>
    <p class="sub">Baseado nos itens que voce marcou na aba Lista e nos precos ja registrados.</p>
    ${corpo}
  </div>`;
}

  const g = {};

/* ---- backup / restauracao ---- */
function exportarDados(){
  const dump = {
    versao: 1,
    exportadoEm: new Date().toISOString(),
    estado: state,
    historico: historico,
    mes: document.getElementById('mesRef').value
  };
  const blob = new Blob([JSON.stringify(dump, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `lista_compras_backup_${new Date().toISOString().slice(0,10)}.json`;
  a.click();
}

function importarDados(input){
  const file = input.files && input.files[0];
  if(!file) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const dump = JSON.parse(r.result);
      if(!dump.estado || !dump.historico) throw new Error('arquivo invalido');
      if(!confirm('Isto vai substituir a lista e o historico atuais pelos dados do arquivo. Continuar?')){ input.value=''; return; }
      state = dump.estado;
      historico = dump.historico;
      proximoId = state.reduce((m,i)=> Math.max(m, i.id||0), -1) + 1;
      if(dump.mes != null) document.getElementById('mesRef').value = dump.mes;
      salvar();
      render();
      alert('Dados importados com sucesso.');
    } catch(e){
      alert('Nao consegui ler este arquivo de backup.');
    }
    input.value = '';
  };
  r.readAsText(file);
}

        return `
          <div class="justa-card ${barato ? 'melhor' : 'pior'}">
            <div class="justa-topo">
              <b>${selo(cmp.mercado)}</b>
              <span class="comum">${cmp.comum} ${cmp.comum === 1 ? 'item em comum' : 'itens em comum'} com o ${selo(cj.ref.mercado)}</span>
            </div>
            <div class="justa-linha">
              Nesses itens voce pagou <b>${brl(cmp.custoAqui)}</b> — os mesmos, nos precos do ${selo(cj.ref.mercado)}, sairiam <b>${brl(cmp.custoRef)}</b>.
            </div>
            <div class="justa-veredito ${barato ? 'bom' : 'ruim'}">
              ${barato
                ? `▼ ${brl(-cmp.dif)} mais barato (${pct.toFixed(0)}%)`
                : `▲ ${brl(cmp.dif)} mais caro (${pct.toFixed(0)}%)`}
              &middot; melhor preco em ${cmp.vitorias} de ${cmp.comum}
            </div>
            ${cmp.soAqui > 0 ? `<div class="justa-nota">${cmp.soAqui} ${cmp.soAqui === 1 ? 'item so aparece' : 'itens so aparecem'} nesta compra e ${cmp.soAqui === 1 ? 'ficou' : 'ficaram'} de fora da comparacao.</div>` : ''}
          </div>`;
      }).join('');

      html += `
        <div class="painel">
          <h2>Comparacao justa &mdash; mesma cesta</h2>
          <p class="sub">O total de cada compra nao serve para comparar: a do ${esc(cj.ref.mercado)} foi o estoque inicial, com muito mais itens. Aqui a conta e so sobre os itens que cada compra tem em comum com ela, nas mesmas quantidades.</p>
          ${cards}
        </div>

        <div class="painel">
          <h2>Onde cada mercado e mais barato</h2>
          <p class="sub">Gasto por categoria em cada compra. A celula verde e o menor preco daquela linha. Categorias que uma compra nao tinha aparecem como &mdash;.</p>
          ${tabelaComparativa(historico)}
        </div>

        <div class="painel">
          <h2>Total desembolsado em cada compra</h2>
          <p class="sub">Quanto saiu do bolso em cada uma. Sao cestas de tamanhos diferentes (veja a quantidade de itens), entao este numero e so o gasto do dia &mdash; nao serve para dizer qual mercado e mais barato.</p>
          ${graficoTotais(historico)}
        </div>`;
    }

    html += `
      <div class="painel">
        <h2>Compras registradas</h2>
        <p class="sub">Clique no valor real para corrigir.</p>
        <div class="tabela-rolagem">
        <table class="hist">
          <thead>
            <tr><th>Mercado</th><th>Referencia</th><th class="num">Itens</th><th class="num">Estimado</th><th class="num">Real</th><th class="num">Diferenca</th><th></th></tr>
          </thead>
          <tbody>
            ${[...historico].reverse().map(c => {
              const dif = c.real != null ? c.real - c.estimado : null;
              return `<tr>
                <td><b style="cursor:pointer;text-decoration:underline dotted" onclick="editarMercado(${c.id})"><span class="mseloi" style="background:${corMercado(c.mercado||'')}"></span>${esc(c.mercado || 'informar')}</b></td>
                <td>${esc(c.mes || '')}<div style="font-size:0.72rem;color:var(--muted)">${new Date(c.data).toLocaleDateString('pt-BR')}</div></td>
                <td class="num">${c.nItens}</td>
                <td class="num">${brl(c.estimado)}</td>
                <td class="num"><span style="cursor:pointer;text-decoration:underline dotted" onclick="editarReal(${c.id})">${c.real != null ? brl(c.real) : 'informar'}</span></td>
                <td class="num ${dif == null ? '' : (dif > 0 ? 'dif-sobe' : 'dif-desce')}">${dif == null ? '—' : (dif > 0 ? '+' : '') + brl(dif)}</td>
                <td class="num"><button class="btn danger" style="padding:4px 9px;font-size:0.75rem" onclick="removerCompra(${c.id})">remover</button></td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>
        </div>
      </div>
    `;
  }

  el.innerHTML = html;
}

/* ================= INICIO ================= */
document.getElementById('mesRef').value = ler(CHAVE_MES) || '';
preencherSelectCategorias();
render();
</script>
</body>
</html>
